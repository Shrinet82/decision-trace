[project]
name = "decision-trace-backend"
version = "0.1.0"
description = "Decision-Trace Company Brain Backend powered by Cognee and FalkorDB"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee==1.6.3",
    "cognee-community-hybrid-adapter-falkor==0.3.1",
    "falkordb==1.7.1",
    "fastembed==0.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring real FalkorDB and LLM connections",
]
