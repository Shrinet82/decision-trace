services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decision-trace-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - LANCEDB_PATH=/app/data_storage/.lancedb
      - SYSTEM_ROOT_DIRECTORY=/app/data_storage/cognee_system
      - DATA_ROOT_DIRECTORY=/app/data_storage/cognee_data
    volumes:
      - decision_trace_data:/app/data_storage

volumes:
  decision_trace_data:
    driver: local
