name: Deploy Backend to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/mcp_smoke.py'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy on Railway Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Railway (Remote Cloud Build)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set "FALKORDB_GRAPH_NAME=c87aa0cf-1c09-5296-8518-a3e8b9a1e744" --service decision-trace-api
          railway variable set "DATASET_NAME=c87aa0cf-1c09-5296-8518-a3e8b9a1e744" --service decision-trace-api
          # Startup imports the LLM/ML stack (~10 s locally); the default 15 s healthcheck window is too tight
          railway variable set "RAILWAY_HEALTHCHECK_TIMEOUT_SEC=120" --service decision-trace-api
          railway up --service decision-trace-api -c

      # Connect to the deployed /mcp with the official Python MCP client, list the tools, call every
      # read tool and assert the benchmark answers (Keycloak -> DEC-11, Snowflake impact -> DEC-03/13/17)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: MCP smoke test against production
        run: |
          pip install "mcp>=1.28.1,<2"
          for attempt in 1 2 3; do
            python scripts/mcp_smoke.py && exit 0
            echo "attempt $attempt failed; retrying in 30 s"; sleep 30
          done
          exit 1

      - name: Show runtime logs of a failed deployment
        if: failure()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Last lines of the container's own output (startup errors), long token-like strings masked
          timeout 45 railway logs --service decision-trace-api 2>&1 \
            | sed -E 's/[A-Za-z0-9+\/=_-]{32,}/***/g' | tail -120 || true
