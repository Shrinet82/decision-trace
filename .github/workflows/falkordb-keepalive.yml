name: FalkorDB Cloud 6-Hour Keepalive Cron

on:
  schedule:
    # Trigger every 6 hours to prevent free-tier instance from sleeping
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Run FalkorDB Keepalive Query
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FalkorDB Driver
        run: pip install falkordb python-dotenv

      - name: Execute Keepalive OpenCypher Query
        env:
          FALKORDB_HOST: ${{ secrets.FALKORDB_HOST }}
          FALKORDB_PORT: ${{ secrets.FALKORDB_PORT }}
          FALKORDB_USERNAME: ${{ secrets.FALKORDB_USERNAME }}
          FALKORDB_PASSWORD: ${{ secrets.FALKORDB_PASSWORD }}
          FALKORDB_GRAPH_NAME: ${{ secrets.FALKORDB_GRAPH_NAME || 'c87aa0cf-1c09-5296-8518-a3e8b9a1e744' }}
        run: python scripts/keepalive.py
